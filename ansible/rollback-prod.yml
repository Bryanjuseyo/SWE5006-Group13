- name: Rollback production deployment
  hosts: production
  become: yes

  vars:
    app_dir: /home/ubuntu/SWE5006-Group13

  tasks:
    - name: Go to application directory and fetch latest git history
      shell: |
        cd {{ app_dir }}
        git fetch origin
      args:
        executable: /bin/bash

    - name: Checkout rollback commit
      shell: |
        cd {{ app_dir }}
        git checkout {{ rollback_commit }}
      args:
        executable: /bin/bash

    - name: Stop production containers without deleting volumes
      shell: |
        cd {{ app_dir }}
        docker compose --env-file .env.prod -f docker-compose.prod.yml down
      args:
        executable: /bin/bash

    - name: Rebuild and start production containers from rollback commit
      shell: |
        cd {{ app_dir }}
        docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
      args:
        executable: /bin/bash

    - name: Show running containers
      shell: docker ps
      register: docker_ps_output

    - name: Print running containers
      debug:
        var: docker_ps_output.stdout_lines