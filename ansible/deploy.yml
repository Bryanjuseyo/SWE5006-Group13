---
- name: Deploy CleanMatch to EC2
  hosts: staging
  become: true

  tasks:
    - name: Pull latest code
      git:
        repo: https://github.com/Bryanjuseyo/SWE5006-Group13.git
        dest: /home/ubuntu/SWE5006-Group13
        version: staging
        force: yes

    - name: Stop existing containers
      shell: |
        cd /home/ubuntu/SWE5006-Group13
        docker compose --env-file .env.staging -f docker-compose.staging.yml down
      ignore_errors: yes

    - name: Start containers
      shell: |
        cd /home/ubuntu/SWE5006-Group13
        docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build

    - name: Seed staging database
      shell: |
        docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T backend python -m scripts.seed_initial_data
      args:
        chdir: ~/SWE5006-Group13
        
    - name: Install CloudWatch agent
      shell: |
        wget -q https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
        dpkg -i amazon-cloudwatch-agent.deb
      args:
        creates: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent

    - name: Configure CloudWatch agent
      copy:
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        content: |
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/lib/docker/containers/**/*-json.log",
                      "log_group_name": "cleanmatch-staging",
                      "log_stream_name": "{instance_id}"
                    }
                  ]
                }
              }
            }
          }

    - name: Start CloudWatch agent
      shell: |
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config -m ec2 \
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s