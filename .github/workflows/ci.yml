name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx vitest --run
      - run: npm run build

      - name: Snyk frontend scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=frontend/package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Lint
        env:
          PYTHONPATH: .
        run: |
          pip install flake8
          flake8 . --max-line-length=120

      - name: Snyk backend scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/requirements.txt --skip-unresolved

      - name: Run tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          FLASK_ENV: testing
          PYTHONPATH: .
        run: pytest

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cleanmatch_user
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: cleanmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cleanmatch_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      papercut:
        image: changemakerstudiosus/papercut-smtp:latest
        ports:
          - 2525:2525
          - 37408:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://cleanmatch_user:securepassword123@localhost:5432/cleanmatch
          SMTP_HOST: localhost
          SMTP_PORT: 2525
          SMTP_FROM: noreply@cleanmatch.com
          PYTHONPATH: .
        run: python main.py &

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Serve frontend
        working-directory: ./frontend
        run: npx serve -s dist -l 5173 &

      - name: Wait for services
        run: |
          npx wait-on http://localhost:5000/api/health http://localhost:5173 http://localhost:37408/api/messages --timeout 60000

      - name: Install E2E dependencies and browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: ./e2e
        run: npx playwright test --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
