name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: "Git commit SHA to rollback production to"
        required: true
        type: string

jobs:
  rollback:
    name: Rollback Production on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$EC2_SSH_KEY" > ~/.ssh/cleanmatch-key.pem
          chmod 600 ~/.ssh/cleanmatch-key.pem

      - name: Create production Ansible inventory
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
          PROD_EC2_PORT: ${{ secrets.PROD_EC2_PORT }}
        run: |
          echo "[production]" > inventory.ini
          echo "$PROD_EC2_HOST ansible_user=$PROD_EC2_USER ansible_port=$PROD_EC2_PORT ansible_ssh_private_key_file=~/.ssh/cleanmatch-key.pem" >> inventory.prod.ini

      - name: Add EC2 host key to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.PROD_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback production
        run: |
          ansible-playbook -i inventory.prod.ini ansible/rollback-prod.yml \
            --extra-vars "rollback_commit=${{ github.event.inputs.rollback_commit }}"