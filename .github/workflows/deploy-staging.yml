name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  ci:
    name: Run CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          FLASK_ENV: testing
        run: pytest || true

  deploy:
    name: Deploy to EC2 via Ansible
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$EC2_SSH_KEY" > ~/.ssh/cleanmatch-key.pem
          chmod 600 ~/.ssh/cleanmatch-key.pem

      - name: Create Ansible inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        
        run: |
          echo "[staging]" > inventory.ini
          echo "$EC2_HOST ansible_user=$EC2_USER ansible_port=$EC2_PORT ansible_ssh_private_key_file=~/.ssh/cleanmatch-key.pem" >> inventory.ini
          cat inventory.ini
        
      - name: Add EC2 host key to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i inventory.ini ansible/deploy.yml

    zap_scan:
      name: OWASP ZAP Baseline Scan - Staging
      runs-on: ubuntu-latest
      needs: deploy

      steps:
        - name: Run OWASP ZAP Baseline Scan on Staging
          uses: zaproxy/action-baseline@v0.13.0
          with:
            target: ${{ secrets.EC2_HOST }}
            fail_action: false
          