services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cleanmatch
      POSTGRES_USER: cleanmatch_user
      POSTGRES_PASSWORD: cleanmatch_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanmatch_user -d cleanmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  papercut:
    image: changemakerstudiosus/papercut-smtp:latest
    ports:
      - "2525:2525"   # SMTP
      - "37408:8080"  # Web UI
    restart: always

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      papercut:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cleanmatch_user:securepassword123@db:5432/cleanmatch
      SMTP_HOST: ${SMTP_HOST:-papercut}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@cleanmatch.com}
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always


volumes:
  postgres_data:
