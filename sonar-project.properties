sonar.organization=bryanjuseyo
sonar.projectKey=Bryanjuseyo_SWE5006-Group13
sonar.projectName=CleanMatch

sonar.sources=frontend/src,backend/app
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/venv/**,**/__pycache__/**,**/.git/**,**/coverage/**
sonar.coverage.exclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
